services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_PATH: /data/telemetry.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - telemetry-data:/data
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_CPU_WARNING_THRESHOLD: ${VITE_CPU_WARNING_THRESHOLD:-85}
        VITE_MEMORY_WARNING_THRESHOLD: ${VITE_MEMORY_WARNING_THRESHOLD:-85}
        VITE_DISK_WARNING_THRESHOLD: ${VITE_DISK_WARNING_THRESHOLD:-90}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    profiles: ["mqtt"]
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 2 >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  telemetry-data:
  mqtt-data:
  mqtt-log: